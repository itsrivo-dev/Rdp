; =============================================================================
;  supervisord - PID 1 of the container.
;
;  Owns start order (priority), automatic restarts and graceful shutdown. On
;  SIGTERM - what Railway sends when it stops, redeploys or moves the container
;  - every program gets SIGTERM in reverse priority order and the container
;  exits 0.
;
;  All programs log to the container's stdout/stderr so that the Railway log
;  view shows everything in one place. Nothing here ever prints a password.
; =============================================================================
[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
identifier=cloudpc
strip_ansi=true

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; -----------------------------------------------------------------------------
; System message bus. XFCE, Thunar and xfsettingsd all expect one. Starts first
; because everything graphical connects to it.
; -----------------------------------------------------------------------------
[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile --nosyslog
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------------
; Display + VNC server (TigerVNC Xtigervnc) on 127.0.0.1:5900.
; The web gateway is the only client; nothing else can reach the port.
; -----------------------------------------------------------------------------
[program:vnc]
command=/opt/cloudpc/bin/cloudpc-vnc
user=%(ENV_DESKTOP_USER)s
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------------
; The XFCE session itself. A session that dies within 15 seconds counts as a
; failed start, so a broken desktop configuration is reported instead of being
; restarted in a tight loop.
; -----------------------------------------------------------------------------
[program:session]
command=/opt/cloudpc/bin/cloudpc-session
user=%(ENV_DESKTOP_USER)s
priority=30
autostart=true
autorestart=true
startsecs=15
startretries=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------------
; The web gateway: login page, noVNC assets, WebSocket -> VNC bridge, health.
; Runs unprivileged; it can read the password *hash* but never the password.
; -----------------------------------------------------------------------------
[program:gateway]
command=/usr/bin/python3 -u /opt/cloudpc/gateway/server.py
user=cloudpc
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------------
; Health probes + self-healing restarts, with a hard cap on restart attempts.
; -----------------------------------------------------------------------------
[program:watchdog]
command=/opt/cloudpc/bin/cloudpc-watchdog
priority=50
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
