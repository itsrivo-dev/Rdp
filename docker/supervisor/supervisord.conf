; =============================================================================
;  supervisord - PID 1 of the container.
;  Owns start order, automatic restarts and graceful shutdown. On SIGTERM
;  (which is what Railway sends when it stops or replaces a container) it
;  stops every program with SIGTERM, waits, then exits 0.
; =============================================================================
[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
identifier=cloudpc
strip_ansi=false

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; -----------------------------------------------------------------------------
; System message bus. XFCE, Thunar and the notification daemon all expect one.
; -----------------------------------------------------------------------------
[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile --nosyslog
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------------
; xrdp session manager: authenticates users (PAM), starts/stops the per-user
; Xvnc + XFCE session. Must start before xrdp.
; stopasgroup/killasgroup stay false so that a sesman restart does not tear
; down desktop sessions that are still running.
; -----------------------------------------------------------------------------
[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=false
killasgroup=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------------
; The RDP listener itself (TLS, port 3389).
; -----------------------------------------------------------------------------
[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------------
; Status / health HTTP endpoint used by the Railway healthcheck.
; Runs as the unprivileged "cloudpc" user - it never holds the RDP password.
; -----------------------------------------------------------------------------
[program:status-server]
command=/usr/bin/python3 -u /opt/cloudpc/health/server.py
user=cloudpc
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------------
; Service health checks + self-healing restarts.
; -----------------------------------------------------------------------------
[program:watchdog]
command=/opt/cloudpc/bin/cloudpc-watchdog
priority=50
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
