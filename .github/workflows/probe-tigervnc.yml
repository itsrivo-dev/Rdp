name: probe-tigervnc
# Temporary: confirm that tigervnc-tools provides /usr/bin/vncpasswd.
on:
  push:
    paths:
      - ".github/workflows/probe-tigervnc.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List the contents of the tigervnc-tools package
        run: |
          out="$(docker run --rm ubuntu:22.04 sh -c '
            apt-get update -qq >/dev/null 2>&1;
            cd /tmp;
            apt-get download tigervnc-tools >/dev/null 2>&1;
            echo "== bin files in the tigervnc-tools .deb ==";
            dpkg-deb -c tigervnc-tools*.deb | grep -E "/bin/|/sbin/";
            echo "== after installing it ==";
            apt-get install -y -qq --no-install-recommends tigervnc-tools >/dev/null 2>&1;
            command -v vncpasswd || echo "vncpasswd STILL MISSING";
            vncpasswd --help 2>&1 | head -3;
          ' 2>&1 | tr "\n" "|")"
          echo "::error::PROBE-${out:0:7000}"
          exit 1
