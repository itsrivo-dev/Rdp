name: build-and-test

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:
    inputs:
      keep_logs:
        description: "Attach the full container log to the report"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build image and run the full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            freerdp2-x11 xvfb jq shellcheck netcat-openbsd
          xfreerdp --version | head -2 || true

      - name: Static checks
        id: lint
        run: |
          set -o pipefail
          chmod +x tests/*.sh scripts/*.sh docker/entrypoint.sh docker/bin/* docker/xrdp/*.sh
          tests/lint.sh 2>&1 | tee lint.log

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cloudpc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image facts
        run: |
          docker image inspect cloudpc:test \
            --format 'size: {{.Size}} bytes ({{div .Size 1048576}} MB) / layers: {{len .RootFS.Layers}}' | tee image.log
          docker history cloudpc:test --human --format '{{.Size}}\t{{.CreatedBy}}' | head -20 >> image.log

      - name: Integration tests
        id: integration
        run: |
          set -o pipefail
          tests/integration.sh cloudpc:test 2>&1 | tee integration.log

      - name: Collect report
        if: always()
        run: |
          {
            echo "## CI report \`${GITHUB_SHA:0:8}\` — run [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "**status:** \`${{ job.status }}\`  •  **lint:** \`${{ steps.lint.outcome }}\`  •  **integration:** \`${{ steps.integration.outcome }}\`"
            echo
            echo "### image"
            echo '```'
            cat image.log 2>/dev/null | head -25
            echo '```'
            echo "### static checks"
            echo '```'
            tail -c 8000 lint.log 2>/dev/null
            echo '```'
            echo "### integration tests"
            echo '```'
            tail -c 26000 integration.log 2>/dev/null
            echo '```'
            echo "### container log (tail)"
            echo '```'
            tail -c 14000 test-results/container.log 2>/dev/null
            echo '```'
            echo "### xrdp-sesman log (tail)"
            echo '```'
            tail -c 6000 test-results/xrdp-sesman.log 2>/dev/null
            echo '```'
            echo "### rdp client log (tail)"
            echo '```'
            tail -c 4000 test-results/rdp-client-1.log 2>/dev/null
            echo '```'
          } > report.md
          # GitHub comments are limited to 65536 characters.
          head -c 64000 report.md > report.trunc.md
          mv report.trunc.md report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="CI test reports"
          number="$(gh issue list --state all --search "\"$title\" in:title" \
                      --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ -z "$number" ]; then
            number="$(gh issue create --title "$title" \
              --body "Automated build and test reports for the Ubuntu Cloud PC image. Each comment is one CI run." \
              | sed 's#.*/##')"
          fi
          gh issue comment "$number" --body-file report.md
          echo "report posted to issue #$number"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            lint.log
            integration.log
            image.log
            test-results/
          retention-days: 7
          if-no-files-found: warn
